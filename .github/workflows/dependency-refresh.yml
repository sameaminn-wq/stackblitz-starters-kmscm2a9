name: Dependency refresh

on:
  push:
    branches:
      - "fix/production-readiness-2026-11"

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/production-readiness-2026-11
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply non-breaking audit fixes
        run: npm audit fix --package-lock-only || true
      - name: Clean install
        run: npm ci
      - name: Dependency audit
        run: npm audit || true
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder
          NEXT_PUBLIC_SITE_URL: https://example.invalid
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:fix/production-readiness-2026-11
